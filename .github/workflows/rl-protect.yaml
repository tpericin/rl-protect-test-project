name: rl-protect scan
on:
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: tpericin/gh-action-rl-protect-scan@sdlc-comment
        env:
          RL_TOKEN: ${{ secrets.RL_TOKEN }}
        with:
          scan-path: requirements.txt
          report: rl-protect-pip.report.json
          post-pr-comment: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-assessment: simplified
          comment-level: fail
      - uses: tpericin/gh-action-rl-protect-scan@sdlc-comment
        if: always()
        env:
          RL_TOKEN: ${{ secrets.RL_TOKEN }}
        with:
          scan-path: package.json
          report: rl-protect-npm-1.report.json
          post-pr-comment: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-assessment: simplified
          comment-license: true
          comment-level: warn
      - uses: tpericin/gh-action-rl-protect-scan@sdlc-comment
        if: always()
        env:
          RL_TOKEN: ${{ secrets.RL_TOKEN }}
        with:
          scan-path: projects/package.json
          report: rl-protect-npm-2.report.json
          post-pr-comment: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-assessment: table
          comment-license: true
          comment-policy: true
          comment-level: warn